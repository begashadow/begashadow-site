<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Streaming — BEGA Shadow Resistance</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{background:radial-gradient(circle at 50% 0,rgba(216,161,63,.16),transparent 34%),#050505}
    .stream-wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:38px 0 56px}
    .back{display:inline-flex;margin-bottom:26px;color:#f4cf79;text-decoration:none;font-weight:900}
    .stream-head{text-align:center;margin-bottom:28px}.stream-head img{width:min(100%,520px);aspect-ratio:16/6;object-fit:cover;border-radius:20px;border:1px solid rgba(216,161,63,.35)}
    .stream-head h1{font-size:clamp(2.2rem,7vw,4rem);margin:22px 0 8px}.stream-head p{color:#b9b0a1}
    .platforms{display:grid;gap:12px}.platform{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:13px;padding:17px 18px;border:1px solid rgba(216,161,63,.25);border-radius:17px;background:#101010;text-decoration:none}
    .platform-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(216,161,63,.13);color:#f4cf79;font-weight:900}.platform small{display:block;color:#b9b0a1;margin-top:4px}
  </style>
</head>
<body>
  <main class="stream-wrap">
    <a class="back" href="../">← Retour au site</a>
    <section class="stream-head">
      <img id="stream-banner" src="../assets/bega-banner.svg" alt="BEGA Shadow Resistance">
      <h1>Écouter BEGA</h1>
      <p>Choisis ta plateforme préférée.</p>
    </section>
    <section id="platforms" class="platforms"></section>
  </main>

  <script>
    const icons={spotify:"S",apple:"♪",deezer:"D",youtube:"▶",amazon:"A",tidal:"T",soundcloud:"☁",qobuz:"Q",bandcamp:"B",music:"♫",link:"↗"};
    fetch("../data/site.json?v="+Date.now()).then(r=>r.json()).then(data=>{
      if(data.banner && data.banner.image) document.getElementById("stream-banner").src="../"+data.banner.image;
      const list=(data.platforms||[]).filter(p=>p.visible&&p.url);
      const box=document.getElementById("platforms");
      if(!list.length){box.innerHTML='<p>Aucune plateforme disponible.</p>';return;}
      list.forEach(p=>{
        const a=document.createElement("a");
        a.className="platform";a.href=p.url;a.target="_blank";a.rel="noopener";
        const icon=icons[String(p.icon||"link").toLowerCase()]||"↗";
        a.innerHTML=`<span class="platform-icon">${icon}</span><span><strong>${p.name}</strong><small>Ouvrir la plateforme</small></span><span>↗</span>`;
        box.appendChild(a);
      });
    });
  </script>
</body>
</html>
